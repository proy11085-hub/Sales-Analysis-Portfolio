
name: Sales Project Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f README.md
          test -f SQL/analysis.sql
          test -f Dataset/README.md
          echo "All required project files exist!"
      - name: Display project information
        run: |
          echo "Sales Analysis Portfolio"
          echo "Repository check completed successfully!"
          git log -1 --oneline